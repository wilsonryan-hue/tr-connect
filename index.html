<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Treun Roc Connect</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0a0a0a;color:#f3f0e6;font-family:Georgia,"Palatino Linotype",serif}
    main{min-height:100vh;display:grid;place-items:center;padding:2rem}
    .card{max-width:26rem;text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 1rem;border-radius:8px;background:#121212;border:1px solid #2a2a2a;display:grid;place-items:center;color:#d4af37;letter-spacing:.2em;font-size:.7rem}
    h1{font-weight:500;font-size:1.7rem;margin:0 0 .4rem}
    p{color:#9a9588;line-height:1.45}
    a{color:#d4af37}
  </style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark">TR</div>
    <h1>Treun Roc Connect</h1>
    <p id="msg">Opening the live desk…</p>
    <p><a id="fallback" href="#">Open manually</a></p>
  </div>
</main>
<script>
  const extra = location.search || "";
  const hash = location.hash || "";
  async function go() {
    let url = "";
    try {
      const r = await fetch("live.json?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      if (j && j.url) url = j.url.replace(/\/?$/, "/");
    } catch (e) {}
    const a = document.getElementById("fallback");
    if (url) {
      const dest = url.replace(/\/?$/, "/") + extra.replace(/^\?/, "?") + hash;
      a.href = dest;
      window.location.replace(dest);
    } else {
      document.getElementById("msg").textContent = "The door is up. The live desk is waking — try again in a minute.";
    }
  }
  go();
</script>
</body>
</html>
