<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>TR Site</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0a0a0a;color:#f3f0e6;font-family:Georgia,"Palatino Linotype",serif}
    main{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 1rem;border-radius:8px;background:#121212;border:1px solid #2a2a2a;display:grid;place-items:center;color:#d4af37;letter-spacing:.2em;font-size:.7rem}
  </style>
</head>
<body>
<main>
  <div class="mark">TR</div>
  <h1>Site phone</h1>
  <p>Opening the site phone…</p>
</main>
<script>
  const as = new URLSearchParams(location.search).get("as");
  const q = as ? "?as=" + encodeURIComponent(as) : "";
  location.replace("./#/site" + q);
</script>
</body>
</html>
